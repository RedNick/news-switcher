<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hourly News Switcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- news-switcher.js puts the YouTube player inside this element -->
  <div id="player-container"></div>

  <!-- Shown until the browser lets us play sound. Clicking it unmutes. -->
  <button id="unmute-button" type="button" hidden>🔇 Tap to turn sound on</button>

  <!-- Optional on-screen extras. Toggle from the ☰ menu or with the "H" key. -->
  <div id="extras-panel">
    <div id="now-playing">
      <span id="channel-name">Loading…</span>
      <span id="channel-status"></span>
    </div>
    <div id="next-up">
      Next: <span id="next-channel-name">–</span> in <span id="countdown">–</span>
    </div>
    <div id="controls">
      <button id="previous-button" type="button" title="Previous channel (←)">⏮ Prev</button>
      <button id="next-button" type="button" title="Next channel (→)">Next ⏭</button>
    </div>
  </div>

  <!-- Settings menu, top middle so it stays clear of YouTube's own buttons
       in the corners. Open with the ☰ button or the "M" key. -->
  <div id="menu-area">
    <button id="menu-button" type="button" title="Settings (M)"
            aria-controls="settings-menu" aria-expanded="false">☰</button>

    <div id="settings-menu" hidden>
      <label class="menu-option">
        <input id="show-extras-checkbox" type="checkbox">
        Show channel info and controls (H)
      </label>

      <h2>Sources</h2>
      <p class="menu-hint">Tick the channels to rotate through. Click a name to watch it now.</p>
      <ul id="source-list"></ul>
    </div>
  </div>

  <script src="channels.js"></script>
  <script src="news-switcher.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
